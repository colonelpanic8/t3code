# Configuration for the self-hosted F-Droid repository of assembly builds.
#
# `scripts/fdroid/build-repo.sh` copies this file into a scratch directory, fills
# `repo/` with APKs downloaded from GitHub releases, and runs `fdroid update`.
# `.github/workflows/android-stack-build.yml` deploys the result to GitHub Pages.
#
# Secrets are resolved from the environment at `fdroid update` time through
# fdroidserver's `{env: ...}` indirection, so nothing sensitive is committed.

repo_url: https://colonelpanic8.github.io/t3code/fdroid/repo
repo_name: T3 Code Assembly
repo_icon: icon.png
repo_description: >-
  Source-built Android snapshots of Ivan Malison's locked T3 Code assembly.
  These are unofficial builds and are not affiliated with T3 Tools Inc. They
  install alongside official T3 Code variants rather than replacing them.

# Every published version stays in the main repo; there is no archive section to
# deploy or link to.
archive_older: 0

# One private key signs both APKs and the repository index. The workflow reads
# it only from GitHub Actions secrets.
keystore: keystore.p12
repo_keyalias: { env: FDROID_KEY_ALIAS }
keystorepass: { env: FDROID_KEYSTORE_PASSWORD }
keypass: { env: FDROID_KEY_PASSWORD }

make_current_version_link: false
