name: Android Stack Build

# Builds an installable APK from the personal integration stack, without EAS.
# Upstream's mobile-eas-*.yml workflows need pingdotgg's EXPO_TOKEN and blacksmith
# runners, neither of which exists on a fork; this one uses a GitHub-hosted runner
# and a Nix-pinned Android toolchain instead.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: App variant (APP_VARIANT)
        type: choice
        default: preview
        options: [preview, development, production]
  push:
    branches:
      - t3code/stack

concurrency:
  group: android-stack-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      # `inputs` is empty for push events, so this needs a default.
      APP_VARIANT: ${{ inputs.variant || 'preview' }}
      EXPO_NO_GIT_STATUS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # androidenv's SDK/NDK derivations are unfree, so Hydra never builds them and
      # cache.nixos.org has nothing to serve. Without this cache every run refetches
      # ~4GB straight from Google.
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-android-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-android-${{ runner.os }}-
          # The two NDKs dominate the closure at roughly 2.5GB each.
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-android-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Realise the Android toolchain
        run: nix develop .#android --command true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prebuild the Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --clean --platform android

      # app.config.ts pins version 0.1.0 and never sets android.versionCode, so
      # every build would otherwise be version code 1. An F-Droid index rejects
      # duplicate version codes, so derive a unique increasing one. Minutes since
      # 2020-01-01 UTC is monotonic with history and stays far below the 2100000000
      # ceiling. Patching the generated build.gradle keeps this out of app.config.ts,
      # which is shared with upstream and with EAS builds.
      - id: version
        name: Derive a unique version code
        run: |
          set -euo pipefail
          gradle_file=apps/mobile/android/app/build.gradle
          commit_epoch="$(git show -s --format=%ct HEAD)"
          version_code=$(( (commit_epoch - 1577836800) / 60 ))
          version_name="0.1.0-stack.$(git rev-parse --short HEAD)"

          sed -i -E "s/^([[:space:]]*)versionCode .*/\1versionCode $version_code/" "$gradle_file"
          sed -i -E "s/^([[:space:]]*)versionName .*/\1versionName \"$version_name\"/" "$gradle_file"

          # A silent no-op here would ship version code 1 and be rejected only much
          # later, when the F-Droid index is built.
          grep -q "versionCode $version_code" "$gradle_file"
          grep -q "versionName \"$version_name\"" "$gradle_file"

          # Deliberately not a v*.*.* tag: the release.yml inherited from upstream
          # triggers on those, and its blacksmith-* runners do not exist on a fork,
          # so such a tag would queue a desktop release job forever.
          {
            echo "code=$version_code"
            echo "name=$version_name"
            echo "tag=android-stack-$APP_VARIANT-$(date -u -d "@$commit_epoch" +%Y%m%d)-$(git rev-parse --short HEAD)"
            echo "asset=t3code-$APP_VARIANT-$version_name-arm64-v8a.apk"
          } >> "$GITHUB_OUTPUT"
          echo "Version code $version_code, version name $version_name"

      # `assembleRelease` is signed with the debug keystore the Expo template ships
      # (android/app/build.gradle points the release signingConfig at it). That
      # keystore is checked into the template, so the signature is identical across
      # runs and installs upgrade in place.
      #
      # reactNativeArchitectures is the template's own knob for which ABIs to
      # package. Building arm64-v8a alone drops 91MB of native libraries: x86 and
      # x86_64 are emulator-only and armeabi-v7a only matters for pre-2017 devices.
      # An emulator needs its own build rather than this artifact.
      - name: Assemble the release APK
        run: |
          NODE_BIN_DIR="$(dirname "$(command -v node)")"
          export NODE_BIN_DIR
          # shellcheck disable=SC2016 # Expanded by the inner bash, which nix
          # develop starts with this exported value intact.
          nix develop .#android --command bash -c '
            set -euo pipefail
            # The React Native Gradle plugin shells out to node to bundle JS.
            export PATH="$NODE_BIN_DIR:$PATH"
            cd apps/mobile/android
            ./gradlew assembleRelease --no-daemon --stacktrace \
              -PreactNativeArchitectures=arm64-v8a
          '

      - name: Report the APK size
        run: |
          set -euo pipefail
          apk="$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          {
            echo "### Android stack build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| APK | \`$(basename "$apk")\` |"
            echo "| Size | $(du -h "$apk" | cut -f1) |"
            echo "| Version | ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }}) |"
            echo "| ABI | arm64-v8a |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: t3code-${{ inputs.variant || 'preview' }}-android-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # Artifacts expire and need a login to fetch. A release is permanent and
      # publicly downloadable, which is also what the F-Droid repository indexes.
      - name: Publish a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.version.outputs.asset }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          apk="$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          cp "$apk" "$RUNNER_TEMP/$ASSET"

          # Built in a file rather than inline, so YAML block indentation does not
          # end up in the rendered release body.
          notes="$RUNNER_TEMP/notes.md"
          # shellcheck disable=SC2016 # The backticks are literal markdown code spans.
          {
            printf 'Android build of the personal integration stack at `%s`.\n\n' "$GITHUB_SHA"
            printf -- '- Variant: `%s`\n' "$APP_VARIANT"
            printf -- '- Version code: `%s`\n' "$VERSION_CODE"
            printf -- '- ABI: `arm64-v8a` only\n\n'
            printf 'Signed with the debug keystore the Expo template ships, so every build here\n'
            printf 'shares a signature and upgrades in place from any other.\n'
          } > "$notes"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running the same commit should refresh the asset, not fail.
            gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/$ASSET" \
              --title "T3 Code Mobile $VERSION_NAME" \
              --notes-file "$notes"
          fi

          echo "Release: $(gh release view "$TAG" --json url --jq .url)"
